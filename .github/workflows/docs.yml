# Publish docs/ as the documentation website (mkdocs.yml) on GitHub Pages.
# Needs Pages enabled with "GitHub Actions" as the source (repo Settings ->
# Pages, or: gh api -X POST repos/etmeyer/SwiftUVOT_Complete/pages -f build_type=workflow).
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned: MkDocs 2.0 will not be compatible with Material for MkDocs.
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7
      # --strict fails the build on a broken link or anchor
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
